<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="assets/image/profile-pic.jpg" alt="Profile Picture"
        class="profile-pic">
        <h2 class="name">Seyed Abbas</h2>
        <p class="bio">Web Developer | Passionate about coding
            and desing</p>
        <div class="social-link">
            <a href="https://github.com" target="_blank"
            class="social-btn github">GitHub</a>
            <a href="https://linkedin.com" target="_blank"
            class="social-btn linkedin">LinkedIn</a>
            <a href="https://twitter.com" target="_blank"
            class="social-btn twitter">Twitter</a>
        </div>
    </div>
</body>
</html>
